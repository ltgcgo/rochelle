name: Publish to registries
on:
  push:
    branches:
      - main
    paths:
      - 'deno.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Generate relevant data
        run: "./shx generate"
      - name: Publish package
        run: "./shx publish"
